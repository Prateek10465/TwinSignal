<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twin Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; position: fixed; inset: 0; width: 100%; height: 100%; background: #14170C; overflow: hidden; overscroll-behavior: none; }
  #wrap { position: absolute; left: 50%; top: calc(50% + 16px); width: 1280px; height: 720px; transform-origin: 0 0; contain: layout; }
  #stage { width: 1280px; height: 720px; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  button:focus-visible, input:focus-visible, .knob:focus-visible { outline: 3px solid #E0B84C; outline-offset: 2px; }
  input { transition: border-color 0.15s ease; }
  input:hover:not(:disabled):not(:focus-visible) { border-color: #556B2F !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mv { transition: transform 0.12s ease-out; }
  .rm .mv, .rm * { transition: none !important; animation: none !important; }

  /* Shared control buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; font-family: 'Silkscreen', monospace; font-weight: 700; cursor: pointer; user-select: none; transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s ease, border-color 0.12s ease, color 0.12s ease; }
  .btn:disabled { opacity: 0.5; cursor: default; transform: none !important; box-shadow: none !important; }
  .btn:hover:not(:disabled) { transform: translate(-1px, -1px); }
  .btn:active:not(:disabled) { transform: translate(2px, 2px) !important; }

  .btn-primary { border: 0; background: #556B2F; color: #F6F4EC; box-shadow: 4px 4px 0 #2C3A18; letter-spacing: 2px; }
  .btn-primary:hover:not(:disabled) { box-shadow: 5px 5px 0 #2C3A18; }
  .btn-primary:active:not(:disabled) { box-shadow: 2px 2px 0 #2C3A18 !important; }

  .btn-ghost { background: transparent; border: 1px solid #556B2F; color: #556B2F; box-shadow: 3px 3px 0 rgba(85,107,47,0.3); letter-spacing: 1px; }
  .btn-ghost:hover:not(:disabled) { background: rgba(85,107,47,0.08); box-shadow: 4px 4px 0 rgba(85,107,47,0.3); }
  .btn-ghost:active:not(:disabled) { box-shadow: 1px 1px 0 rgba(85,107,47,0.3) !important; }

  .btn-ink { background: #262B16; border: 1px solid #262B16; color: #F6F4EC; box-shadow: 3px 3px 0 #14170C; letter-spacing: 1px; }
  .btn-ink:hover:not(:disabled) { box-shadow: 4px 4px 0 #14170C; }
  .btn-ink:active:not(:disabled) { box-shadow: 1px 1px 0 #14170C !important; }

  #bar { position: absolute; left: 0; right: 0; top: 0; height: 32px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 12px; box-sizing: border-box; background: #14170C; }
  #bar span { margin-right: auto; font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 2px; color: #8A8A72; }
  #bar button { height: 24px; padding: 0 10px; background: transparent; border: 1px solid #55583F; color: #C9D79A;
    font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 1px;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
  #bar button:hover:not(:disabled) { background: rgba(201, 215, 154, 0.1); border-color: #8A8A72; color: #F6F4EC; transform: translate(-1px, -1px); box-shadow: 2px 2px 0 #14170C; }
  #bar button:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 0 0 0; }
  #bar button.hot { border-color: #E0B84C; color: #E0B84C; animation: hbglow 1.2s infinite; }

  #toast { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); z-index: 6; padding: 8px 16px; background: #262B16; color: #F6F4EC;
    font-family: 'Silkscreen', monospace; font-size: 13px; letter-spacing: 2px; display: none; }
  #toast.show { display: block; animation: fadein 0.25s both; }

  @keyframes shake { 0%,100% { transform: translate(0,0) } 20% { transform: translate(-6px,3px) } 40% { transform: translate(5px,-4px) } 60% { transform: translate(-4px,-2px) } 80% { transform: translate(3px,3px) } }
  .shake { animation: shake 0.4s; }
  @keyframes hb { 0%,100% { transform: scale(1) } 12% { transform: scale(1.06) } 24% { transform: scale(1) } 36% { transform: scale(1.04) } }
  @keyframes hbglow { 0%,100% { box-shadow: 0 0 0 0 rgba(224,184,76,0) } 12% { box-shadow: 0 0 0 4px rgba(224,184,76,0.9) } 36% { box-shadow: 0 0 0 3px rgba(224,184,76,0.6) } }
  .hb { animation: hb 0.9s infinite; transform-origin: left center; }
  .hbg { animation: hbglow 0.9s infinite; }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0 } 70% { transform: scale(1.2); opacity: 1 } 100% { transform: scale(1) } }
  .pop { display: inline-block; animation: pop 0.35s both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .fadein { animation: fadein 0.4s both; }
  @keyframes drawl { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
  .race-line { stroke-dasharray: 1; animation: drawl 2.4s ease-out both; }
  @keyframes roleprog { from { width: 100%; } to { width: 0%; } }
  .role-prog { animation: roleprog 3.6s linear forwards; }

  /* Title screen brand & motion */
  @keyframes titleIntro {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .title-brand {
    animation: titleIntro 0.5s ease-out both;
  }
  .beacon-pip {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #556B2F;
    box-shadow: 0 0 0 0 rgba(85, 107, 47, 0.85);
    animation: beaconPulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    flex-shrink: 0;
  }
  @keyframes beaconPulse {
    0% { box-shadow: 0 0 0 0 rgba(85, 107, 47, 0.85); background: #8CA05A; }
    65% { box-shadow: 0 0 0 8px rgba(85, 107, 47, 0); background: #556B2F; }
    100% { box-shadow: 0 0 0 0 rgba(85, 107, 47, 0); background: #556B2F; }
  }

  .title-heading {
    position: relative;
    display: inline-block;
    cursor: default;
    user-select: none;
  }
  .title-word {
    display: inline-block;
    transition: letter-spacing 0.25s ease, filter 0.25s ease, text-shadow 0.25s ease;
  }
  .title-twin {
    color: #262B16;
    animation: twinHarmonic 5.5s ease-in-out infinite;
    transform-origin: center bottom;
  }
  .title-signal {
    color: #556B2F;
    animation: sigHarmonic 5.5s ease-in-out infinite;
    transform-origin: center top;
  }

  /* Per-character quantum wave */
  .t-char {
    display: inline-block;
    transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.16s ease, text-shadow 0.16s ease;
    animation: charWave 3.8s ease-in-out infinite;
    animation-delay: calc(var(--i) * 0.13s);
    will-change: transform;
    cursor: default;
  }
  @keyframes charWave {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-3.5px) scale(1.03); }
    70% { transform: translateY(2px) scale(0.98); }
  }
  .t-char:hover {
    transform: translateY(-8px) scale(1.15) !important;
    color: #E0B84C !important;
    text-shadow: 0 0 16px rgba(224, 184, 76, 0.95), 0 0 28px rgba(85, 107, 47, 0.6) !important;
    transition-duration: 0.06s;
  }
  .t-char-w:hover svg {
    filter: drop-shadow(0 0 10px rgba(224, 184, 76, 0.95)) drop-shadow(0 0 20px rgba(85, 107, 47, 0.6));
  }

  @keyframes twinHarmonic {
    0%, 100% {
      transform: translateY(0);
      text-shadow: 0 0 0 rgba(85, 107, 47, 0), 2px 2px 0 rgba(38, 43, 22, 0.16);
    }
    30% {
      transform: translateY(-2px);
      text-shadow: 0 0 14px rgba(85, 107, 47, 0.35), 2px 4px 0 rgba(38, 43, 22, 0.12);
    }
    70% {
      transform: translateY(1.5px);
      text-shadow: 0 0 4px rgba(85, 107, 47, 0.1), 1px 1px 0 rgba(38, 43, 22, 0.16);
    }
    91% { transform: translateY(0); filter: none; }
    93% { transform: translate(-2px, 1px); filter: drop-shadow(-2px 0 0 rgba(85, 107, 47, 0.5)); }
    95% { transform: translate(2px, -0.5px); filter: drop-shadow(2px 0 0 rgba(224, 184, 76, 0.5)); }
    97% { transform: translate(0, 0); filter: none; }
  }

  @keyframes sigHarmonic {
    0%, 100% {
      transform: translateY(0);
      text-shadow: 0 0 0 rgba(85, 107, 47, 0), 2px 2px 0 rgba(44, 58, 24, 0.2);
    }
    30% {
      transform: translateY(2px);
      text-shadow: 0 0 22px rgba(85, 107, 47, 0.55), 2px 1px 0 rgba(44, 58, 24, 0.25);
    }
    70% {
      transform: translateY(-1.5px);
      text-shadow: 0 0 8px rgba(85, 107, 47, 0.2), 3px 3px 0 rgba(44, 58, 24, 0.15);
    }
    91% { transform: translateY(0); filter: none; }
    93.5% { transform: translate(2px, -1px); filter: drop-shadow(2px 0 0 rgba(85, 107, 47, 0.7)); }
    95.5% { transform: translate(-2px, 1px); filter: drop-shadow(-2px 0 0 rgba(224, 184, 76, 0.6)); }
    97% { transform: translate(0, 0); filter: none; }
  }

  /* Quantum scanbeam sweep across title */
  .title-heading::after {
    content: "";
    position: absolute;
    left: -14px;
    right: -14px;
    height: 3px;
    background: linear-gradient(90deg, transparent, rgba(85, 107, 47, 0.6) 20%, rgba(224, 184, 76, 0.95) 50%, rgba(85, 107, 47, 0.6) 80%, transparent);
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(224, 184, 76, 0.85));
    animation: titleScan 5s ease-in-out infinite;
  }
  @keyframes titleScan {
    0%, 70% { top: -8px; opacity: 0; }
    73% { opacity: 0.9; }
    87% { top: 170px; opacity: 0.9; }
    90%, 100% { top: 170px; opacity: 0; }
  }

  .title-heading:hover .title-twin {
    letter-spacing: 2px;
    text-shadow: 0 0 16px rgba(85, 107, 47, 0.4), 2px 2px 0 rgba(38, 43, 22, 0.2);
  }
  .title-heading:hover .title-signal {
    letter-spacing: 2px;
    text-shadow: 0 0 28px rgba(85, 107, 47, 0.75), 0 0 42px rgba(85, 107, 47, 0.4);
  }

  /* Telemetry sine wave */
  .telemetry-pulse {
    animation: sineDash 2.4s linear infinite;
  }
  @keyframes sineDash {
    from { stroke-dashoffset: 60; }
    to { stroke-dashoffset: 0; }
  }

  /* Background entangled thread flow & dual photon streams */
  .beam-forward {
    animation: beamFlowFwd 2.8s linear infinite;
    filter: drop-shadow(0 0 5px rgba(224, 184, 76, 0.95));
  }
  @keyframes beamFlowFwd {
    from { stroke-dashoffset: 780; }
    to { stroke-dashoffset: 0; }
  }
  .beam-reverse {
    animation: beamFlowRev 3.4s linear infinite;
    filter: drop-shadow(0 0 4px rgba(140, 160, 90, 0.9));
  }
  @keyframes beamFlowRev {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: 780; }
  }

  /* Repeaters on arch blinking sequentially */
  .repeater {
    transform-box: fill-box;
    transform-origin: center;
    animation: repPulse 2.8s ease-in-out infinite;
  }
  .rep-1 { animation-delay: 0.1s; }
  .rep-2 { animation-delay: 0.5s; }
  .rep-3 { animation-delay: 0.9s; }
  .rep-4 { animation-delay: 1.5s; }
  .rep-5 { animation-delay: 1.9s; }
  .rep-6 { animation-delay: 2.3s; }
  @keyframes repPulse {
    0%, 75%, 100% { fill: #262B16; transform: scale(1); filter: none; }
    35% { fill: #E0B84C; transform: scale(1.6); filter: drop-shadow(0 0 4px rgba(224, 184, 76, 0.9)); }
  }

  /* Central node rotating scanner reticle */
  .twin-reticle {
    animation: reticleSpin 12s linear infinite;
    transform-origin: 620px 300px;
  }
  @keyframes reticleSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Core blinking pip */
  .twin-core-pip {
    animation: corePulse 2.2s ease-in-out infinite;
  }
  @keyframes corePulse {
    0%, 100% { fill: #262B16; }
    50% { fill: #E0B84C; filter: drop-shadow(0 0 3px rgba(224, 184, 76, 0.8)); }
  }

  /* Twin node label subtle glow */
  .twin-link-txt {
    animation: twinTxtGlow 3s ease-in-out infinite;
  }
  @keyframes twinTxtGlow {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; filter: drop-shadow(0 0 5px rgba(85, 107, 47, 0.7)); }
  }

  /* Expanding ripples at central node */
  .twin-ripple {
    animation: twinRipple 3.2s cubic-bezier(0.16, 0.8, 0.3, 1) infinite;
    transform-origin: 620px 300px;
  }
  .twin-ripple.r2 {
    animation-delay: 1.6s;
  }
  @keyframes twinRipple {
    0% { r: 14px; opacity: 0.95; stroke-width: 2.5px; }
    100% { r: 60px; opacity: 0; stroke-width: 0.5px; }
  }

  /* Agent idle stance in bunker rooms */
  .bob-a {
    animation: agentBob 3.6s ease-in-out infinite;
  }
  .bob-b {
    animation: agentBob 3.6s ease-in-out -1.8s infinite;
  }
  @keyframes agentBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* Perimeter wireframe scanner line around bunkers */
  .room-perimeter {
    stroke-dasharray: 14 28;
    animation: perimeterTrace 12s linear infinite;
  }
  @keyframes perimeterTrace {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: 280; }
  }

  /* Measurement cards glowing quantum spin aura */
  .card-red {
    animation: cardRedGlow 2.4s ease-in-out infinite;
  }
  @keyframes cardRedGlow {
    0%, 100% { filter: drop-shadow(0 0 1px rgba(209, 58, 66, 0.4)); }
    50% { filter: drop-shadow(0 0 7px rgba(209, 58, 66, 0.95)) drop-shadow(0 0 12px rgba(224, 184, 76, 0.5)); }
  }

  .card-blue {
    animation: cardBlueGlow 2.4s ease-in-out -1.2s infinite;
  }
  @keyframes cardBlueGlow {
    0%, 100% { filter: drop-shadow(0 0 1px rgba(45, 91, 136, 0.4)); }
    50% { filter: drop-shadow(0 0 7px rgba(45, 91, 136, 0.95)) drop-shadow(0 0 12px rgba(85, 107, 47, 0.5)); }
  }

  /* Ambient Radar sweep in background */
  .radar-sweep {
    animation: radarSpin 18s linear infinite;
  }
  @keyframes radarSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* High-energy photon spark pulses along arch */
  .spark-1 {
    animation: sparkFlow1 2.3s linear infinite;
    filter: drop-shadow(0 0 5px #FFFDF6) drop-shadow(0 0 10px #E0B84C);
  }
  .spark-2 {
    animation: sparkFlow2 2.8s linear infinite;
    filter: drop-shadow(0 0 6px #E0B84C);
  }
  @keyframes sparkFlow1 {
    from { stroke-dashoffset: 800; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes sparkFlow2 {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: 800; }
  }

  /* Desk transmitter emitter rings */
  .desk-emitter-ring {
    animation: emitterRing 2.2s ease-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  .emitter-b {
    animation-delay: 1.1s;
  }
  @keyframes emitterRing {
    0% { transform: scale(0.6); opacity: 1; stroke-width: 2.5px; }
    100% { transform: scale(2.4); opacity: 0; stroke-width: 0.5px; }
  }

  /* Bunker vault door LEDs */
  .door-led {
    filter: drop-shadow(0 0 4px currentColor);
  }
  .led-red {
    fill: #D13A42;
    animation: ledBlink 2.8s steps(1) infinite;
  }
  .led-green {
    fill: #556B2F;
    animation: ledBlink 2.8s steps(1) -1.4s infinite;
  }
  @keyframes ledBlink {
    0%, 75% { opacity: 1; }
    76%, 88% { opacity: 0.25; }
    89%, 100% { opacity: 1; }
  }

  /* Knobs */
  .knob { transition: transform 0.1s ease, filter 0.1s ease; outline: none; }
  .knob.is-drag { transform: scale(1.06); filter: drop-shadow(0 0 6px rgba(224, 184, 76, 0.9)); }
  .knob.is-drag .knob-act-tick { stroke: #E0B84C !important; }
  .knob.knob-active { outline: 2px dashed #556B2F; outline-offset: 4px; border-radius: 4px; background: rgba(85, 107, 47, 0.08); }

  /* Gauge and progress bar fill */
  .bar-fill { transition: width 180ms ease-out, background 180ms ease-out; }

  /* Overlays and dialogs */
  @keyframes ov-bg-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ov-panel-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .ov-backdrop { animation: ov-bg-fade 0.16s ease-out both; }
  .ov-panel { animation: ov-panel-in 0.16s ease-out both; }

  /* Drift & Retest flashes */
  @keyframes goldflash {
    0% { box-shadow: 0 0 0 0 rgba(224, 184, 76, 0); }
    30% { box-shadow: 0 0 16px 6px rgba(224, 184, 76, 0.95); transform: scale(1.08); }
    100% { box-shadow: 0 0 0 0 rgba(224, 184, 76, 0); transform: scale(1); }
  }
  .gold-flash { animation: goldflash 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }

  @keyframes pairflash {
    0% { box-shadow: 0 0 0 0 rgba(224, 184, 76, 0); border-color: #E0B84C; }
    40% { box-shadow: 0 0 16px 4px rgba(224, 184, 76, 0.8); border-color: #E0B84C; background: #FFFDF0; }
    100% { box-shadow: 0 0 0 0 rgba(224, 184, 76, 0); }
  }
  .pair-flash { animation: pairflash 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }

  /* Vote squares */
  @keyframes vote-tick {
    0% { transform: scale(0); opacity: 0; }
    65% { transform: scale(1.25); }
    100% { transform: scale(1); opacity: 1; }
  }
  .vote-sq-filled { display: inline-block; width: 12px; height: 12px; background: #556B2F; animation: vote-tick 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  /* Bell meter fill */
  @keyframes bell-grow { from { width: 0%; } }
  .bell-fill { animation: bell-grow 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Bell limit broken celebration stinger */
  @keyframes bellGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224, 184, 76, 0); border-color: #E0B84C; }
    50% { box-shadow: 0 0 14px 4px rgba(224, 184, 76, 0.75); border-color: #FFFDF6; }
  }
  .bell-banner {
    animation: bellGlow 1.8s ease-in-out infinite;
  }

  /* Mole sabotage pulse */
  @keyframes crimsonpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); border-color: #8B0000; }
    50% { box-shadow: 0 0 12px 3px rgba(220, 38, 38, 0.85); border-color: #FF4D4D; }
  }
  .crimson-pulse { animation: crimsonpulse 1.2s infinite ease-in-out; background: #8B0000 !important; color: #FFFDF6 !important; }

  /* Meeting agent cards & quick chat */
  .agent-card { cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease; }
  .agent-card:hover:not(.is-selected) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(38, 43, 22, 0.15); border-color: #55583F !important; }
  .agent-card.is-selected { border: 3px solid #262B16 !important; background: #F6F4EC !important; }

  .quick-chip { background: transparent; border: 1px solid #B3B198; color: #3B4228; cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.08s ease; }
  .quick-chip:hover:not(:disabled) { background: #ECEADD !important; color: #556B2F !important; border-color: #556B2F !important; transform: translateY(-1px); }
  .quick-chip:active:not(:disabled) { transform: translateY(1px); }

  /* First-exposure coach copy */
  .coach { box-sizing: border-box; padding: 8px 10px; background: #F6F4EC; border-left: 3px solid #556B2F; font-size: 11px; line-height: 15px; color: #3B4228; }
  .coach b { display: block; margin-bottom: 3px; font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1px; color: #556B2F; font-weight: 700; }

  /* Table / score rows hover */
  .score-row, .case-row { transition: background 0.12s ease; }
  .score-row:hover, .case-row:hover { background: rgba(85, 107, 47, 0.09) !important; }

  #role-proceed-btn { transition: transform 0.1s ease, box-shadow 0.1s ease !important; }
  #role-proceed-btn:hover { transform: scale(1.02); }
  #role-proceed-btn:active { transform: scale(0.96) translate(1px, 1px) !important; }

  /* Door opening fade */
  @keyframes doorfade { from { opacity: 0; } to { opacity: 1; } }
  .door-fade { animation: doorfade 0.15s ease-out both; }

  #ov { position: absolute; inset: 0; z-index: 9; }
  #ov:empty { display: none; }
  #rot { display: none; position: fixed; inset: 0; z-index: 30; background: #14170C; color: #C9D79A; font-family: 'Silkscreen', monospace; letter-spacing: 2px; text-align: center; padding: 40px 24px; box-sizing: border-box; align-items: center; justify-content: center; font-size: 16px; line-height: 28px; }
  @media (orientation: portrait) and (max-width: 820px) { #rot { display: flex; } }
  @media (max-width: 820px) { #bar span { display: none; } }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="bar">
